<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscribe</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.10.0/dist/cdn.min.js"
      defer
    ></script>
  </head>

  <body>
    <div id="loader" style="display: none">loading...</div>

    <div class="outer">
      <div class="main">

        <header>
          <div class="corner">ST</div>
          <div class="main-message">Shorten Track</div>
        </header>

        <div>
          <div class="centered">
            <div>Account: <b>{{ .Email }}</b></div>
          </div>
          <br />

          <form class="form" id="payment-form">
            <div id="payment-element"></div>
            <!-- <div class="centered">
              <div class="total" id="total">Total: $4.99</div>
            </div> -->
            <div class="centered">
              <button class="submit" type="submit">Pay $4.99</button>
            </div>
          </form>

          <div class="centered">{{ template "contact.html" . }}</div>

          <div style="color: rgb(222, 0, 0)" id="error-message"></div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const stripe = Stripe(
          "pk_test_51PqnrdFKfZyWoeG1V6v3bJ9gBR5HTosFE2Awg8qEQ7HVWOpLP1QelADSBYHrUtBzxj3TdNTzITLjUrAlZNkWYLOT00EtiIbE8I"
        );
        const clientSecret = "{{ .Secret }}";

        const elements = stripe.elements({
          clientSecret,
          appearance: {
            theme: "night",
            variables: {
              colorPrimary: "#ffffff",
              colorBackground: "#1a1a1a",
              colorText: "#ffffff",
              colorTextSecondary: "#bbbbbb",
              colorDanger: "#ff4d4d",
            },
          },
        });

        const paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

        const form = document.getElementById("payment-form");
        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          document.getElementById("loader").style.display = "flex";

          try {
            const { setupIntent, error } = await stripe.confirmSetup({
              elements,
              confirmParams: {
                return_url: window.location.href,
              },
              redirect: "if_required",
            });

            if (error) {
              document.getElementById("error-message").textContent =
                error.message;
            } else {
              const paymentMethodId = setupIntent.payment_method;

              const response = await fetch("/subscription", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                credentials: "include",
                body: JSON.stringify({ paymentMethodID: paymentMethodId }),
              });

              if (response.ok) {
                location.reload();
              } else {
                const errorData = await response.json();
                document.getElementById("error-message").textContent =
                  errorData.error;
              }
            }
          } catch (err) {
            document.getElementById("error-message").textContent =
              "Error processing payment, please try again.";
          } finally {
            document.getElementById("loader").style.display = "none";
          }
        });
      });

      function logoutButton() {
        fetch("/logout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",
        })
          .catch((e) => console.error(e))
          .finally(() => {
            window.close();
            window.location.href = "https://shortentrack.com";
          });
      }
    </script>
  </body>
</html>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Anton&display=swap");
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  @font-face {
    font-family: "JetBrains Mono";
    src: url("/assets/JetBrains/JetBrainsMono-Regular.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-Bold.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-ExtraBold.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-ExtraLight.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-Light.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-Medium.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-SemiBold.ttf") format("truetype"),
      url("/assets/JetBrains/JetBrainsMono-Thin.ttf") format("truetype");
  }

  .main {
    max-width: 900px;
    background-color: rgb(36, 36, 36);
    height: 100dvh;
    min-width: min(100dvw, 750px);
    padding: 25px;
  }

  .outer {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .centered {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 10px;
  }

  button {
    padding: 0.5rem;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 2px;
    border: none;
    font-family: "JetBrains Mono", "Courier New", monospace;
  }
  button:hover {
    background: #ff3e00;
    color: white;
    outline: none;
  }

  body {
    background-color: black;
    color: #f7f9fa;
    font-family: "JetBrains Mono", "Courier New", monospace;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  header > div {
    margin: 6px;
  }

  .corner {
    font-family: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold",
      sans-serif;
    text-decoration: none;
    font-size: 3em;
    color: #ff3e00;
  }

  .main-message {
    font-size: 3em;
    font-weight: bold;
    text-decoration: none;
    color: #f7f9fa;
  }

  .total {
    font-family: "Poppins", Arial, Helvetica, sans-serif;
  }

  .submit {
    min-width: 200px;
  }
</style>
